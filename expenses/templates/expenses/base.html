<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учёт расходов{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --accent: #34d399;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 35%),
                radial-gradient(circle at 85% 10%, rgba(52, 211, 153, 0.12) 0%, transparent 35%),
                radial-gradient(circle at 50% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        body::before {
            content: "SM   $   SM   $   SM   $   SM   $   SM   $   SM   $   SM   $";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 4.5rem;
            letter-spacing: 1rem;
            color: rgba(148, 163, 184, 0.035);
            white-space: pre-wrap;
            word-break: break-all;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff !important;
        }

        .navbar-brand i { color: var(--accent); }

        .navbar .btn-outline-light {
            border-radius: 8px;
            font-weight: 500;
            border-width: 1.5px;
            border-color: rgba(255,255,255,0.25);
        }

        .navbar .btn-outline-light:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
        }

        .navbar-toggler {
            border-color: rgba(255,255,255,0.25);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }

        .stat-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(99,102,241,0.9) 0%, rgba(79,70,229,0.9) 100%);
            border-radius: 18px;
            padding: 1.5rem 1.75rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
        }

        .stat-card::after {
            content: "$";
            position: absolute;
            right: -10px;
            bottom: -35px;
            font-size: 8rem;
            font-weight: 800;
            color: rgba(255,255,255,0.08);
            line-height: 1;
        }

        .stat-card .amount {
            font-size: clamp(1.7rem, 6vw, 2.4rem);
            font-weight: 800;
            color: #fff;
            position: relative;
            z-index: 1;
            word-break: break-word;
        }

        .stat-card .label {
            opacity: 0.85;
            font-size: 0.85rem;
            color: #fff;
            position: relative;
            z-index: 1;
        }

        .table {
            color: var(--text);
            border-radius: 12px;
            overflow: hidden;
        }

        .table thead th {
            border: none;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-muted);
            background: transparent;
            white-space: nowrap;
        }

        .table tbody tr { border-color: var(--border); }

        .table tbody td {
            vertical-align: middle;
            padding-top: 0.8rem;
            padding-bottom: 0.8rem;
            border-color: var(--border);
        }

        .table-hover tbody tr:hover {
            background: rgba(129, 140, 248, 0.08);
        }

        .badge-category {
            background: rgba(129, 140, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 8px;
            padding: 0.35em 0.7em;
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .form-control, .form-select {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            border: 1.5px solid var(--border);
            padding: 0.6rem 0.9rem;
            color: var(--text);
        }

        .form-control:focus, .form-select:focus {
            background: rgba(15, 23, 42, 0.7);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
            color: var(--text);
        }

        .form-control::placeholder { color: var(--text-muted); }
        .form-control[type="date"] { color-scheme: dark; }

        .btn {
            border-radius: 10px;
            font-weight: 500;
            padding: 0.55rem 1.2rem;
        }

        .btn-primary {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .btn-primary:hover { background: #4338ca; border-color: #4338ca; }

        .btn-success {
            background: var(--accent);
            border-color: var(--accent);
            color: #0f172a;
            font-weight: 600;
        }
        .btn-success:hover { background: #10b981; border-color: #10b981; color: #0f172a; }

        .btn-danger {
            background: #ef4444;
            border-color: #ef4444;
        }
        .btn-danger:hover { background: #dc2626; border-color: #dc2626; }

        .btn-outline-danger {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.4);
        }
        .btn-outline-danger:hover { background: rgba(248, 113, 113, 0.15); color: #f87171; }

        .btn-outline-secondary {
            color: var(--text-muted);
            border-color: var(--border);
        }
        .btn-outline-secondary:hover {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text);
            border-color: var(--border);
        }

        .page-title {
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #fff;
            font-size: clamp(1.4rem, 5vw, 2rem);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 2.5rem;
            opacity: 0.4;
            display: block;
            margin-bottom: 0.75rem;
        }

        a { color: var(--primary); }
        .form-label { color: var(--text-muted); }

        @media (max-width: 576px) {
            .container { padding-left: 1rem; padding-right: 1rem; }
            .card { border-radius: 14px; }
            .btn-sm { padding: 0.4rem 0.6rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'expense_list' %}">
                <i class="bi bi-wallet2"></i> Учёт расходов
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navContent">
                <div class="d-flex flex-wrap align-items-center gap-2 mt-3 mt-lg-0">
                    {% if user.is_authenticated %}
                        <a class="btn btn-outline-light btn-sm" href="{% url 'add_expense' %}"><i class="bi bi-plus-lg"></i> Добавить</a>
                        <a class="btn btn-outline-light btn-sm" href="{% url 'stats' %}"><i class="bi bi-bar-chart"></i> Статистика</a>
                        <a class="btn btn-outline-light btn-sm" href="{% url 'pricing' %}"><i class="bi bi-star"></i> Премиум</a>
                        <span class="navbar-text text-light small mx-1">{{ user.username }}</span>
                        <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right"></i></a>
                    {% else %}
                        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Войти</a>
                        <a class="btn btn-outline-light btn-sm" href="{% url 'register' %}">Регистрация</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
    <footer class="text-center text-muted small py-4 mt-5">
        <a href="{% url 'terms' %}" class="text-muted me-3">Условия использования</a>
        <a href="{% url 'privacy' %}" class="text-muted me-3">Конфиденциальность</a>
        <a href="{% url 'refund' %}" class="text-muted">Возврат средств</a>
    </footer>

</body>
</body>
</html>
