{% extends 'expenses/base.html' %}
{% block title %}Удалить доход{% endblock %}

{% block content %}
<h1 class="page-title">Удалить доход?</h1>
<div class="card p-4" style="max-width: 500px;">
    <p><strong>{{ income.amount }} сомонӣ</strong> — {{ income.category }}</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger flex-grow-1">Да, удалить</button>
            <a href="{% url 'income_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
